name: Mindustry iOS Compiler

on:
  workflow_dispatch:

jobs:
  ios-comp:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry (ios-deploy branch)
        uses: actions/checkout@v4
        with:
          repository: 'sonphantrung/mindustry'
          ref: 'ios-deploy'
          submodules: recursive
          lfs: true

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1.4.1
        with:
          xcode-version: '15.4.0'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools and Fetch Arc Natives
        run: |
          brew install gnu-sed
          mkdir -p Arc/natives
          wget https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip
          unzip -o arccoreios.zip -d Arc/natives

          mkdir -p ios/libs
          ZIP_FILE=$(find . -maxdepth 2 -iname "*MetalANGLE*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting MetalANGLE..."
            unzip -q -o "$ZIP_FILE" -d temp_extracted
            FOUND_FW=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
            if [ -n "$FOUND_FW" ]; then
              cp -R "$FOUND_FW" ios/libs/
            fi
            rm -rf temp_extracted
          fi

      - name: Grant Permissions
        run: chmod +x ./gradlew

      - name: Build iOS IPA
        run: |
          # Use local Arc instead of remote JitPack resolution
          ./gradlew pack -PnoLocalArc=false
          ./gradlew :ios:robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -PnoLocalArc=false \
            -Probovm.linkerFlags="-ld_classic"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            ios/build/robovm/*.ipa
            ios/build/robovm.tmp/*.ipa
          retention-days: 7
