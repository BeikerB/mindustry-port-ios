name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip MetalANGLE
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p temp_extracted

          # 1. Search for MetalANGLEKit.zip anywhere in the workspace
          ZIP_FILE=$(find . -name "MetalANGLEKit.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file at: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip not found!"
            exit 1
          fi

          # 2. Extract framework to Mindustry/ios/libs
          find temp_extracted -name "MetalANGLEKit.framework" -exec cp -R {} Mindustry/ios/libs/ \;
          rm -rf temp_extracted

          # 3. Verify
          if [ -d "Mindustry/ios/libs/MetalANGLEKit.framework" ]; then
            echo "SUCCESS: MetalANGLEKit.framework successfully unpacked into Mindustry/ios/libs/"
          else
            echo "ERROR: MetalANGLEKit.framework was not found inside MetalANGLEKit.zip!"
            exit 1
          fi

      - name: Fetch Arc iOS Natives
        run: |
          mkdir -p Arc/natives
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            unzip -o -q arccoreios.zip -d Arc/natives || true
            rm -f arccoreios.zip
            find Arc/natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true
          fi

      - name: Configure RoboVM Framework Paths
        run: |
          ROBOVM_XML="Mindustry/ios/robovm.xml"
          LIBS_DIR="$(pwd)/Mindustry/ios/libs"
          
          if [ -f "$ROBOVM_XML" ]; then
            sed -i '' "s|<\/robovm>|<frameworkPaths><path>$LIBS_DIR<\/path><\/frameworkPaths><\/robovm>|" "$ROBOVM_XML"
          fi

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.iosFrameworkSearchPaths="$(pwd)/ios/libs" \
            -Probovm.compilerArgs="-F$(pwd)/ios/libs"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
