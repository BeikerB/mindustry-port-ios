name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup MetalANGLE Framework Everywhere
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p Arc/backends/backend-robovm/libs
          mkdir -p temp_extracted

          # 1. Locate and extract MetalANGLEKit.zip
          ZIP_FILE=$(find . -name "MetalANGLEKit.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting MetalANGLEKit.zip from $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip not found!"
            exit 1
          fi

          # 2. Extract MetalANGLEKit.framework to both Mindustry and Arc locations
          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Copying MetalANGLEKit.framework to target locations..."
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
            cp -R "$FOUND_FRAMEWORK" Arc/backends/backend-robovm/libs/
          else
            echo "ERROR: MetalANGLEKit.framework not found in zip!"
            exit 1
          fi
          
          rm -rf temp_extracted

      - name: Fetch Arc iOS Natives
        run: |
          mkdir -p Arc/natives
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            unzip -o -q arccoreios.zip -d Arc/natives || true
            rm -f arccoreios.zip
            find Arc/natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true
            find Arc/natives -name "*.a" -exec cp {} Arc/backends/backend-robovm/libs/ \; || true
          fi

      - name: Patch RoboVM Configuration Files
        run: |
          MINDUSTRY_LIBS="$(pwd)/Mindustry/ios/libs"
          ARC_LIBS="$(pwd)/Arc/backends/backend-robovm/libs"

          # Update robovm.xml in Mindustry
          if [ -f "Mindustry/ios/robovm.xml" ]; then
            sed -i '' "s|<\/robovm>|<frameworkPaths><path>$MINDUSTRY_LIBS<\/path><path>$ARC_LIBS<\/path><\/frameworkPaths><\/robovm>|" Mindustry/ios/robovm.xml
          fi

          # Update robovm.xml in Arc backend if present
          if [ -f "Arc/backends/backend-robovm/robovm.xml" ]; then
            sed -i '' "s|<\/robovm>|<frameworkPaths><path>$MINDUSTRY_LIBS<\/path><path>$ARC_LIBS<\/path><\/frameworkPaths><\/robovm>|" Arc/backends/backend-robovm/robovm.xml
          fi

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Run robovmArchive
        run: |
          cd Mindustry
          
          # Build dependent tasks first
          ./gradlew pack
          
          # Run RoboVM Archive with explicit search path overrides
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.iosFrameworkSearchPaths="$(pwd)/ios/libs:$(pwd)/../Arc/backends/backend-robovm/libs" \
            -Probovm.compilerArgs="-F$(pwd)/ios/libs -F$(pwd)/../Arc/backends/backend-robovm/libs"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
