name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Extract Arc iOS Natives
        run: |
          mkdir -p Arc/natives
          curl -L -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip"
          unzip -o arccoreios.zip -d Arc/natives
          
          # Copy extracted natives into Mindustry ios libs structure
          mkdir -p Mindustry/ios/libs
          cp -R Arc/natives/* Mindustry/ios/libs/ || true

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          chmod +x ./gradlew
          ./gradlew pack -PnoLocalArc=true
          ./gradlew --stacktrace :ios:deploy \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone" \
            -PnoLocalArc=true

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          # Locate the built IPA or App bundle
          if [ -f "Mindustry/ios/build/robovm/IOSLauncher.ipa" ]; then
            cp Mindustry/ios/build/robovm/IOSLauncher.ipa Mindustry-unsigned.ipa
          else
            APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
            cp -r "$APP_PATH" Payload/
            zip -r Mindustry-unsigned.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-unsigned.ipa
