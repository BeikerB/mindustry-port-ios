- name: Resolve Dependencies and Patch Arc JAR
        run: |
          # 1. Force Gradle to download dependencies so the JAR exists in cache
          cd Mindustry
          ./gradlew :ios:dependencies --no-daemon || true
          cd ..

          # 2. Extract, patch, and repackage any Arc backend-robovm JARs
          find ~/.gradle/caches/modules-2/files-2.1/com.github.Anuken.Arc/backend-robovm -name "*.jar" | while read -r jarfile; do
            echo "Patching JAR: $jarfile"
            TMP_DIR=$(mktemp -d)
            unzip -q "$jarfile" -d "$TMP_DIR"
            
            # Check for robovm.xml inside the extracted JAR
            XML_PATH="$TMP_DIR/META-INF/robovm/ios/robovm.xml"
            if [ -f "$XML_PATH" ]; then
              echo "Removing invalid framework tags from $XML_PATH"
              sed -i '' '/<framework>libGLESv2<\/framework>/d' "$XML_PATH"
              sed -i '' '/<framework>libEGL<\/framework>/d' "$XML_PATH"
              sed -i '' '/<framework>libfeature_support<\/framework>/d' "$XML_PATH"
              
              # Overwrite the original JAR with patched contents
              (cd "$TMP_DIR" && zip -q -r "$jarfile" .)
            fi
            rm -rf "$TMP_DIR"
          done

          # 3. Wipe RoboVM cache so it extracts the freshly patched JAR
          rm -rf ~/.robovm/cache
