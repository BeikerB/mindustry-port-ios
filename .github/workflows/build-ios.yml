name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup MetalANGLE Framework
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p Arc/backends/backend-robovm/libs
          mkdir -p temp_extracted

          # 1. Locate and extract MetalANGLEKit.zip
          ZIP_FILE=$(find . -name "MetalANGLEKit.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting MetalANGLEKit.zip from $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip not found!"
            exit 1
          fi

          # 2. Extract framework
          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Copying MetalANGLEKit.framework..."
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
            cp -R "$FOUND_FRAMEWORK" Arc/backends/backend-robovm/libs/
          else
            echo "ERROR: MetalANGLEKit.framework not found in zip!"
            exit 1
          fi
          
          rm -rf temp_extracted

      - name: Fetch Arc iOS Natives
        run: |
          mkdir -p Arc/natives
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            unzip -o -q arccoreios.zip -d Arc/natives || true
            rm -f arccoreios.zip
            find Arc/natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true
            find Arc/natives -name "*.a" -exec cp {} Arc/backends/backend-robovm/libs/ \; || true
          fi

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Pre-build Arc JARs
        run: |
          cd Mindustry
          # Run pack first to compile and generate backend-robovm-1.0.jar
          ./gradlew pack

      - name: Inject Framework into RoboVM Cache
        run: |
          # Define the target RoboVM cache directory where clang++ looks for frameworks
          CACHE_DIR="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          
          echo "Creating RoboVM cache framework directory at $CACHE_DIR..."
          mkdir -p "$CACHE_DIR"
          
          # Copy MetalANGLEKit directly into the cache directory
          if [ -d "Mindustry/ios/libs/MetalANGLEKit.framework" ]; then
            cp -R Mindustry/ios/libs/MetalANGLEKit.framework "$CACHE_DIR/"
            echo "SUCCESS: Injected MetalANGLEKit.framework into RoboVM cache!"
          else
            echo "ERROR: Mindustry/ios/libs/MetalANGLEKit.framework does not exist!"
            exit 1
          fi

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.compilerArgs="-F$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
