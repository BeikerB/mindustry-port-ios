name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew ios:device -Probovm.iosSkipSigning=true -Probovm.archs=arm64

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r Mindustry/ios/build/robovm/IOSLauncher.app Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
