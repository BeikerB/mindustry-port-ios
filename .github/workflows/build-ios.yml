name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: chmod +x gradlew

      - name: Build Unsigned iOS Application
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-Build
          path: ios/build/robovm/*.ipa
