name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Recombine and Extract Split MetalANGLE
        run: |
          mkdir -p Mindustry/ios/libs
          cd Mindustry/ios/libs
          
          echo "Recombining split zip files..."
          if ls l1.z* 1> /dev/null 2>&1; then
            zip -s 0 l1.zip --out combined.zip
            unzip -q -o combined.zip
            rm combined.zip
          elif [ -f "l1.zip" ]; then
            unzip -q -o l1.zip
          else
            echo "ERROR: l1 split zip files not found in Mindustry/ios/libs!"
            exit 1
          fi

          echo "Ensuring framework path structure..."
          if [ -d "MetalANGLEKit.xcframework/ios-arm64/MetalANGLEKit.framework" ]; then
            cp -R MetalANGLEKit.xcframework/ios-arm64/MetalANGLEKit.framework ./
          fi
          
          if [ -d "MetalANGLEKit.framework" ]; then
            echo "SUCCESS: MetalANGLEKit.framework successfully unpacked!"
          else
            echo "ERROR: MetalANGLEKit.framework missing after extraction!"
            ls -la
            exit 1
          fi

      - name: Fetch Arc iOS Natives
        run: |
          mkdir -p Arc/natives
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            unzip -o -q arccoreios.zip -d Arc/natives || true
            rm -f arccoreios.zip
            find Arc/natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true
          fi

      - name: Configure RoboVM Framework Paths
        run: |
          ROBOVM_XML="Mindustry/ios/robovm.xml"
          LIBS_DIR="$(pwd)/Mindustry/ios/libs"
          
          if [ -f "$ROBOVM_XML" ]; then
            sed -i '' "s|<\/robovm>|<frameworkPaths><path>$LIBS_DIR<\/path><\/frameworkPaths><\/robovm>|" "$ROBOVM_XML"
          fi

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.iosFrameworkSearchPaths="$(pwd)/ios/libs" \
            -Probovm.compilerArgs="-F$(pwd)/ios/libs"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
