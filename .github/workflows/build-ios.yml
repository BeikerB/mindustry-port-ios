name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework (with LFS for Frameworks)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Fetch Static Libraries and Prepare Frameworks
        run: |
          # 1. Fetch prebuilt libarc-freetype.a required by Mindustry
          mkdir -p Mindustry/ios/libs/
          curl -L -o Mindustry/ios/libs/libarc-freetype.a "https://raw.githubusercontent.com/Anuken/Mindustry/master/ios/libs/libarc-freetype.a"

          # 2. Build local backend-robovm JAR inside Arc
          cd Arc
          ./gradlew :backends:backend-robovm:jar
          cd ..

          # 3. Create target directory where RoboVM/clang++ expects MetalANGLEKit.framework
          ROBOVM_FRAMEWORK_DIR="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$ROBOVM_FRAMEWORK_DIR"

          # 4. Extract frameworks directly from the compiled backend-robovm-1.0.jar
          JAR_FILE=$(find Arc/backends/backend-robovm/build/libs -name "*.jar" | head -n 1)
          if [ -n "$JAR_FILE" ]; then
            mkdir -p /tmp/jar_contents
            unzip -o "$JAR_FILE" -d /tmp/jar_contents/
            
            # Copy all extracted iOS frameworks into the target cache folder
            if [ -d "/tmp/jar_contents/META-INF/robovm/ios/libs" ]; then
              cp -r /tmp/jar_contents/META-INF/robovm/ios/libs/* "$ROBOVM_FRAMEWORK_DIR/"
            fi
          fi

          # Verify framework contents
          ls -la "$ROBOVM_FRAMEWORK_DIR"

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
