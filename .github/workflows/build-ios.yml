name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Resolve Dependencies & Extract MetalANGLEKit
        run: |
          # 1. Define target directories
          TARGET_CACHE="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$TARGET_CACHE"
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy static libraries (.a) from Arc
          echo "Copying static libraries..."
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true

          # 3. Force Gradle to resolve all dependencies in Mindustry
          echo "Resolving iOS project dependencies in Mindustry..."
          cd Mindustry
          ./gradlew :ios:dependencies || true
          cd ..

          # 4. Search Gradle cache for MetalANGLE / MetalANGLEKit
          echo "Searching for MetalANGLE frameworks in caches..."
          find ~/.gradle/caches ~/.m2 -type d \( -name "MetalANGLEKit.framework" -o -name "MetalANGLE.framework" \) 2>/dev/null | while read FW; do
            echo "Found framework: $FW"
            cp -R "$FW" "$TARGET_CACHE/" || true
            cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
          done

          # 5. Extract all RoboVM JARs found in Gradle cache
          find ~/.gradle/caches ~/.m2 -name "*.jar" 2>/dev/null | while read JAR; do
            if unzip -l "$JAR" 2>/dev/null | grep -q "MetalANGLE"; then
              echo "Extracting MetalANGLE JAR: $JAR"
              TMP_DIR=$(mktemp -d)
              unzip -o -q "$JAR" -d "$TMP_DIR"
              
              find "$TMP_DIR" -type d \( -name "*.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
                cp -R "$FW" "$TARGET_CACHE/" || true
                cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
              done
              rm -rf "$TMP_DIR"
            fi
          done

          # 6. Fallback: If MetalANGLEKit is still missing, pull from JitPack / GitHub release
          if [ ! -d "$TARGET_CACHE/MetalANGLEKit.framework" ] && [ ! -d "Mindustry/ios/libs/Frameworks/MetalANGLEKit.framework" ]; then
            echo "Framework not found in cache. Downloading prebuilt Arc backend JAR..."
            curl -L -f -o /tmp/backend-robovm.jar "https://repo.jitpack.io/com/github/Anuken/Arc/backend-robovm/v1.0/backend-robovm-v1.0.jar" || true
            if [ -f "/tmp/backend-robovm.jar" ]; then
              TMP_DIR=$(mktemp -d)
              unzip -o -q /tmp/backend-robovm.jar -d "$TMP_DIR"
              find "$TMP_DIR" -type d \( -name "*.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
                cp -R "$FW" "$TARGET_CACHE/" || true
                cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
              done
              rm -rf "$TMP_DIR"
            fi
          fi

          # -------------------------------------------------------------
          # 7. Verification / Sanity Check
          # -------------------------------------------------------------
          echo "=== Target Cache Contents ==="
          ls -la "$TARGET_CACHE" || true
          echo "=== Mindustry Frameworks Contents ==="
          ls -la Mindustry/ios/libs/Frameworks/ || true

          if [ ! -d "$TARGET_CACHE/MetalANGLEKit.framework" ] && [ ! -d "$TARGET_CACHE/MetalANGLE.framework" ]; then
            echo "CRITICAL ERROR: MetalANGLEKit.framework was not found in $TARGET_CACHE!"
            exit 1
          fi

          echo "SUCCESS: MetalANGLEKit framework successfully installed in cache!"

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
