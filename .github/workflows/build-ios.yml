name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14 # Uses an Apple Silicon runner with standard Xcode 15/16 toolchains

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          # Find the compiled .app bundle and copy it to Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
