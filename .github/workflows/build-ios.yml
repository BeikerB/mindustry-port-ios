name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Fetch Arc Native Libraries (.a files)
        run: |
          mkdir -p Mindustry/ios/libs
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            echo "Extracting Arc native libraries..."
            unzip -o -q arccoreios.zip -d temp_natives
            find temp_natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \;
            rm -rf temp_natives arccoreios.zip
          fi

      - name: Extract MetalANGLE Framework for iOS
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p temp_extracted
          
          # Unzip MetalANGLEKit from repo root
          unzip -q -o MetalANGLEKit.zip -d temp_extracted

          # Find and copy ONLY the actual arm64 .framework folder
          ARM64_FRAMEWORK=$(find temp_extracted -path "*/ios-arm64/MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$ARM64_FRAMEWORK" ]; then
            echo "Found arm64 framework at: $ARM64_FRAMEWORK"
            cp -R "$ARM64_FRAMEWORK" Mindustry/ios/libs/
          else
            echo "ERROR: Could not find arm64 MetalANGLEKit.framework"
            exit 1
          fi

          rm -rf temp_extracted
          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          if [ -n "$FOUND_FRAMEWORK" ]; then
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
          fi
          rm -rf temp_extracted

      - name: Resolve Dependencies & Patch RoboVM Cache
        run: |
          cd Mindustry
          # Download dependencies into ~/.gradle without running full build
          ./gradlew :ios:dependencies --no-daemon

          # Find backend-robovm JAR and extract it into RoboVM's target cache path before compilation
          ARC_JAR=$(find ~/.gradle/caches/modules-2 -name "backend-robovm-*.jar" | head -n 1)
          if [ -n "$ARC_JAR" ]; then
            echo "Found backend-robovm jar at $ARC_JAR"
            TARGET_DIR="$HOME/.robovm/cache/ios/arm64/release${ARC_JAR#$HOME/.gradle/caches}/backend-robovm.jar.extracted"
            mkdir -p "$TARGET_DIR"
            unzip -o -q "$ARC_JAR" -d "$TARGET_DIR"

            # Patch robovm.xml inside extracted cache to stop asking for missing GLES frameworks
            find "$TARGET_DIR" -name "robovm.xml" | while read -r xmlfile; do
              sed -i '' '/<framework>libGLESv2<\/framework>/d' "$xmlfile"
              sed -i '' '/<framework>libEGL<\/framework>/d' "$xmlfile"
              sed -i '' '/<framework>libfeature_support<\/framework>/d' "$xmlfile"
            done
          fi

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew :ios:robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
