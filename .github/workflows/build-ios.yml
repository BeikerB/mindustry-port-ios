name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Prepare Native Libraries and RoboVM Frameworks
        run: |
          # 1. Ensure target directories exist
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy static libraries (.a) from Arc checkout
          echo "Copying static libraries from Arc..."
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true

          # 3. Build Arc's backend-robovm module to trigger native framework extraction
          cd Arc
          ./gradlew :backends:backend-robovm:build -x test || true
          cd ..

          # 4. Search for MetalANGLE / MetalANGLEKit across the ENTIRE runner workspace
          echo "Searching for MetalANGLE frameworks in workspace and cache..."
          FOUND_FRAMEWORKS=$(find . ~/.gradle ~/.m2 -type d \( -name "MetalANGLEKit.framework" -o -name "MetalANGLE.framework" \) 2>/dev/null)

          if [ -n "$FOUND_FRAMEWORKS" ]; then
            echo "Found framework at:"
            echo "$FOUND_FRAMEWORKS"
            
            # Copy found frameworks into Mindustry/ios/libs/Frameworks
            echo "$FOUND_FRAMEWORKS" | while read -r FW_PATH; do
              cp -R "$FW_PATH" Mindustry/ios/libs/Frameworks/
            done
          fi

          # 5. Mirror frameworks to ALL search paths clang++ expects
          TARGET_PATH1="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$TARGET_PATH1"

          if [ -d "Mindustry/ios/libs/Frameworks" ]; then
            cp -R Mindustry/ios/libs/Frameworks/* "$TARGET_PATH1/" || true
          fi

          # 6. Print summary
          echo "=== Frameworks in Mindustry Project ==="
          ls -la Mindustry/ios/libs/Frameworks/ || true
          echo "=== Frameworks in RoboVM Target Cache ==="
          ls -la "$TARGET_PATH1" || true

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
