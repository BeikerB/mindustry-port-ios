name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Fetch Arc Native Libraries (.a files)
        run: |
          mkdir -p Mindustry/ios/libs
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            echo "Extracting Arc native libraries..."
            unzip -o -q arccoreios.zip -d temp_natives
            find temp_natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \;
            rm -rf temp_natives arccoreios.zip
          fi

      - name: Extract MetalANGLE Framework for iOS
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p temp_extracted
          
          if [ -f "MetalANGLEKit.zip" ]; then
            unzip -q -o MetalANGLEKit.zip -d temp_extracted
            ARM64_FRAMEWORK=$(find temp_extracted -path "*/ios-arm64/MetalANGLEKit.framework" | head -n 1)
            
            if [ -n "$ARM64_FRAMEWORK" ]; then
              echo "Found arm64 framework at: $ARM64_FRAMEWORK"
              cp -R "$ARM64_FRAMEWORK" Mindustry/ios/libs/
            else
              echo "ERROR: Could not find arm64 MetalANGLEKit.framework inside zip!"
              exit 1
            fi
            rm -rf temp_extracted
          else
            echo "MetalANGLEKit.zip not found in root, skipping extraction step."
          fi

      - name: Create Framework Stubs for Legacy Linker Flags
        run: |
          TARGET_DIR="Mindustry/ios/libs"
          mkdir -p "$TARGET_DIR"

          make_stub() {
            FW_NAME="$1"
            FW_DIR="$TARGET_DIR/$FW_NAME.framework"
            mkdir -p "$FW_DIR"

            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>'$FW_NAME'</string><key>CFBundleIdentifier</key><string>org.gnu.'$FW_NAME'</string><key>CFBundlePackageType</key><string>FWK</string></dict></plist>' > "$FW_DIR/Info.plist"

            clang -dynamiclib -allowable_client any \
              -install_name "@rpath/$FW_NAME.framework/$FW_NAME" \
              -o "$FW_DIR/$FW_NAME" \
              -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -target arm64-apple-ios15.0
          }

          make_stub "libGLESv2"
          make_stub "libEGL"
          make_stub "libfeature_support"

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew :ios:robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
