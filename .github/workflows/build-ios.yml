name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Prepare Native Libraries and RoboVM Frameworks
        run: |
          # 1. Ensure target directories exist
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy libarc-freetype.a from local Arc checkout
          echo "Locating libarc-freetype.a in Arc..."
          ARC_LIB=$(find Arc -name "libarc-freetype.a" | head -n 1)
          if [ -n "$ARC_LIB" ]; then
            echo "Found local libarc-freetype.a at: $ARC_LIB"
            cp "$ARC_LIB" Mindustry/ios/libs/
          else
            echo "Copying any static libs from Arc..."
            find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true
          fi

          # 3. Download RoboVM CocoaTouch JAR from Maven Central
          echo "Downloading RoboVM CocoaTouch JAR..."
          curl -L -f -o /tmp/robovm-cocoatouch.jar "https://repo1.maven.org/maven2/com/mobidevelop/robovm/robovm-cocoatouch/2.3.20/robovm-cocoatouch-2.3.20.jar"

          # 4. Extract entire JAR
          mkdir -p /tmp/cocoatouch_out
          unzip -q /tmp/robovm-cocoatouch.jar -d /tmp/cocoatouch_out/

          # 5. Extract ALL frameworks (MetalANGLE, MetalANGLEKit, etc.)
          find /tmp/cocoatouch_out -type d \( -name "*.framework" -o -name "*.xcframework" \) -exec cp -R {} Mindustry/ios/libs/Frameworks/ \;

          # 6. Mirror extracted frameworks to the expected RoboVM cache path for clang++
          CACHE_DIR="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$CACHE_DIR"
          cp -R Mindustry/ios/libs/Frameworks/* "$CACHE_DIR/" || true

          # 7. Print extracted frameworks for verification
          echo "=== Mindustry/ios/libs Directory ==="
          ls -la Mindustry/ios/libs/
          echo "=== Mindustry/ios/libs/Frameworks Directory ==="
          ls -la Mindustry/ios/libs/Frameworks/

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
