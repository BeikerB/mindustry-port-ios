name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Build Arc & Copy Native Libraries
        run: |
          # Create the missing target folder inside Mindustry
          mkdir -p Mindustry/ios/libs/

          # Build Arc modules to generate static libs
          cd Arc
          ./gradlew build -x test || true
          cd ..

          # Copy any static libs (.a) generated by Arc into Mindustry/ios/libs/
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \;

          # List copied libraries to verify libarc-freetype.a is present
          ls -la Mindustry/ios/libs/

      - name: Install MetalANGLEKit Framework
        run: |
          # Ensure target directory structure exists inside the RoboVM cache
          mkdir -p ~/.robovm/cache/ios/arm64/release/

          # Download and extract MetalANGLEKit into the RoboVM cache directory
          cd ~/.robovm/cache/ios/arm64/release/
          curl -L -o MetalANGLEKit.zip https://raw.githubusercontent.com/mobidevelop/robovm/master/compiler/cocoatouch/src/main/resources/MetalANGLEKit.zip || true
          if [ -f MetalANGLEKit.zip ]; then
            unzip -o MetalANGLEKit.zip
            rm MetalANGLEKit.zip
          fi

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone" \
            -Probovm.frameworks.add=MetalANGLEKit

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
