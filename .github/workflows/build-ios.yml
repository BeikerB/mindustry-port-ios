- name: Prepare Native Libraries and RoboVM Frameworks
        run: |
          # 1. Setup target directory inside Mindustry
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy static libraries from Arc
          echo "Copying static libraries from Arc..."
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true

          # 3. Find all robovm-cocoatouch JARs in the Gradle cache and extract them into their respective cache paths
          echo "Locating robovm-cocoatouch JARs in Gradle cache..."
          find ~/.gradle/caches -name "robovm-cocoatouch-*.jar" | while read JAR_PATH; do
            echo "Processing JAR: $JAR_PATH"
            
            # Extract to temporary directory
            TMP_DIR=$(mktemp -d)
            unzip -q "$JAR_PATH" -d "$TMP_DIR"

            # Copy frameworks to Mindustry project directory
            find "$TMP_DIR" -type d \( -name "*.framework" -o -name "*.xcframework" \) -exec cp -R {} Mindustry/ios/libs/Frameworks/ \;

            # Construct the RoboVM cache directory where clang++ expects to find the frameworks
            CACHE_PATH="$HOME/.robovm/cache/ios/arm64/release${JAR_PATH}.extracted/META-INF/robovm/ios/libs"
            mkdir -p "$CACHE_PATH"

            # Copy extracted framework directly into the exact cache path clang++ checks
            if [ -d "$TMP_DIR/META-INF/robovm/ios/libs" ]; then
              cp -R "$TMP_DIR/META-INF/robovm/ios/libs/"* "$CACHE_PATH/" || true
            fi

            rm -rf "$TMP_DIR"
          done

          # 4. Print verification details
          echo "=== Frameworks in Mindustry/ios/libs/Frameworks ==="
          ls -la Mindustry/ios/libs/Frameworks/
