name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Manual MetalANGLE Framework
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p Arc/backends/backend-robovm/libs
          mkdir -p temp_extracted
          
          ZIP_FILE=$(find . -maxdepth 2 -iname "*MetalANGLE*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file at: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip was not found!"
            exit 1
          fi

          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Copying MetalANGLEKit.framework..."
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
            cp -R "$FOUND_FRAMEWORK" Arc/backends/backend-robovm/libs/
          else
            echo "ERROR: MetalANGLEKit.framework missing inside zip!"
            exit 1
          fi
          
          rm -rf temp_extracted

      - name: Fetch Arc iOS Natives
        run: |
          mkdir -p Arc/natives
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          if [ -f "arccoreios.zip" ]; then
            unzip -o -q arccoreios.zip -d Arc/natives || true
            rm -f arccoreios.zip
            find Arc/natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true
            find Arc/natives -name "*.a" -exec cp {} Arc/backends/backend-robovm/libs/ \; || true
          fi

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Pre-build Arc JARs
        run: |
          cd Mindustry
          ./gradlew pack

      - name: Repackage backend-robovm JAR with Frameworks
        run: |
          JAR_PATH="Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar"
          
          if [ -f "$JAR_PATH" ]; then
            echo "Injecting MetalANGLEKit into $JAR_PATH..."
            mkdir -p jar_contents/META-INF/robovm/ios/libs
            
            # Extract current JAR contents
            unzip -q "$JAR_PATH" -d jar_contents
            
            # Copy framework directly into META-INF/robovm/ios/libs
            cp -R Mindustry/ios/libs/MetalANGLEKit.framework jar_contents/META-INF/robovm/ios/libs/
            
            # Repack the JAR
            cd jar_contents
            zip -r -q "../$JAR_PATH" .
            cd ..
            
            rm -rf jar_contents
            echo "Successfully repackaged backend-robovm-1.0.jar!"
          else
            echo "ERROR: $JAR_PATH not found after running gradlew pack!"
            exit 1
          fi

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
