name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Resolve Dependencies & Extract MetalANGLEKit
        run: |
          # 1. Correct target path required by clang++
          TARGET_CACHE="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$TARGET_CACHE"
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy static libraries from Arc repo
          echo "Copying static libraries from Arc..."
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true

          # 3. Search local filesystem/caches first
          echo "Scanning filesystem for MetalANGLE frameworks..."
          find Arc Mindustry ~/.gradle ~/.m2 ~/.robovm -type d \( -name "MetalANGLEKit.framework" -o -name "MetalANGLE.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
            echo "Found framework: $FW"
            cp -R "$FW" "$TARGET_CACHE/" || true
            cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
          done

          # 4. Reliable Maven Fallback: Fetch official robovm-cocoatouch JAR containing MetalANGLE
          if [ ! -d "$TARGET_CACHE/MetalANGLEKit.framework" ] && [ ! -d "$TARGET_CACHE/MetalANGLE.framework" ]; then
            echo "Framework missing locally. Fetching RoboVM Maven artifacts..."

            # Download Maven JARs that bundle native iOS frameworks
            curl -L -s -o /tmp/robovm-cocoatouch.jar "https://repo1.maven.org/maven2/io/github/berstanio/robovm-cocoatouch/2.3.15/robovm-cocoatouch-2.3.15.jar" || \
            curl -L -s -o /tmp/robovm-cocoatouch.jar "https://repo1.maven.org/maven2/com/mobidevelop/robovm/robovm-cocoatouch/2.3.14/robovm-cocoatouch-2.3.14.jar" || true

            if [ -f "/tmp/robovm-cocoatouch.jar" ]; then
              echo "Extracting robovm-cocoatouch.jar..."
              unzip -o -q /tmp/robovm-cocoatouch.jar -d /tmp/jar_extract || true

              # Copy extracted framework directories
              find /tmp/jar_extract -type d \( -name "*.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
                echo "--> Extracted: $(basename "$FW")"
                cp -R "$FW" "$TARGET_CACHE/" || true
                cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
              done

              # Copy raw META-INF robovm contents directly
              if [ -d "/tmp/jar_extract/META-INF/robovm/ios/libs" ]; then
                cp -R /tmp/jar_extract/META-INF/robovm/ios/libs/* "$TARGET_CACHE/" || true
                cp -R /tmp/jar_extract/META-INF/robovm/ios/libs/* Mindustry/ios/libs/Frameworks/ 2>/dev/null || true
              fi

              rm -rf /tmp/jar_extract /tmp/robovm-cocoatouch.jar
            fi
          fi

          # 5. Sanity Check
          echo "=== Target Cache Contents ==="
          ls -la "$TARGET_CACHE" || true
          echo "=== Mindustry Frameworks Contents ==="
          ls -la Mindustry/ios/libs/Frameworks/ || true

          if [ -z "$(ls -A "$TARGET_CACHE")" ]; then
            echo "---------------------------------------------------------"
            echo "CRITICAL ERROR: MetalANGLEKit.framework is still missing!"
            echo "---------------------------------------------------------"
            exit 1
          fi

          echo "SUCCESS: MetalANGLEKit framework installed! Proceeding to build."

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
