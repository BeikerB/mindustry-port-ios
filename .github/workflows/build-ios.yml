name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Resolve Dependencies & Extract MetalANGLEKit
        run: |
          # 1. Define target directories expected by clang++ and Mindustry
          TARGET_CACHE="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$TARGET_CACHE"
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy static libraries (.a) from Arc repository checkout
          echo "Copying static libraries from Arc..."
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true

          # 3. Search local checkouts and caches for MetalANGLE/MetalANGLEKit
          echo "Scanning filesystem for MetalANGLE frameworks..."
          find Arc Mindustry ~/.gradle ~/.m2 ~/.robovm -type d \( -name "MetalANGLEKit.framework" -o -name "MetalANGLE.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
            echo "Found framework: $FW"
            cp -R "$FW" "$TARGET_CACHE/" || true
            cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
          done

          # 4. Fallback: Download MetalANGLE directly from GitHub Releases/Raw if not present
          if [ ! -d "$TARGET_CACHE/MetalANGLEKit.framework" ] && [ ! -d "$TARGET_CACHE/MetalANGLE.framework" ]; then
            echo "Framework missing locally. Downloading MetalANGLE framework directly..."
            
            # Download compiled MetalANGLE framework from GitHub raw/release sources
            curl -L -s -o /tmp/MetalANGLE.zip "https://raw.githubusercontent.com/Anuken/Arc/master/backends/backend-robovm/libs/MetalANGLEKit.zip" || \
            curl -L -s -o /tmp/MetalANGLE.zip "https://github.com/mobidevelop/robovm/releases/download/robovm-2.3.14/MetalANGLEKit.zip" || true

            if [ -f "/tmp/MetalANGLE.zip" ]; then
              echo "Extracting MetalANGLE.zip..."
              unzip -o -q /tmp/MetalANGLE.zip -d /tmp/ma_extract || true
              
              find /tmp/ma_extract -type d \( -name "*.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
                echo "--> Extracted: $(basename "$FW")"
                cp -R "$FW" "$TARGET_CACHE/" || true
                cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
              done
              rm -rf /tmp/ma_extract
            fi
          fi

          # -------------------------------------------------------------
          # 5. FAIL-FAST CHECKER: Fail in seconds if framework wasn't placed
          # -------------------------------------------------------------
          echo "=== Target Cache Contents ==="
          ls -la "$TARGET_CACHE" || true
          echo "=== Mindustry Frameworks Contents ==="
          ls -la Mindustry/ios/libs/Frameworks/ || true

          if [ ! -d "$TARGET_CACHE/MetalANGLEKit.framework" ] && [ ! -d "$TARGET_CACHE/MetalANGLE.framework" ]; then
            echo "---------------------------------------------------------"
            echo "CRITICAL ERROR: MetalANGLEKit.framework is still missing!"
            echo "---------------------------------------------------------"
            exit 1
          fi

          echo "SUCCESS: MetalANGLEKit framework installed! Proceeding to build."

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
