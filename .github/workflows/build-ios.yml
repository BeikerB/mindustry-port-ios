name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Manual MetalANGLE Framework
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p temp_extracted
          
          ZIP_FILE=$(find . -iname "*MetalANGLE*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found MetalANGLE zip file at: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip was not found!"
            exit 1
          fi

          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Copying MetalANGLEKit.framework to Mindustry/ios/libs..."
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
          else
            echo "ERROR: MetalANGLEKit.framework missing inside zip!"
            exit 1
          fi
          
          rm -rf temp_extracted

      - name: Fetch Arc Native Libraries (.a files)
        run: |
          mkdir -p Mindustry/ios/libs

          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          
          if [ -f "arccoreios.zip" ]; then
            echo "Extracting Arc native libraries..."
            unzip -o -q arccoreios.zip -d temp_natives
            find temp_natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \;
            rm -rf temp_natives arccoreios.zip
          fi

      - name: Force RoboVM Cache Creation & Inject Framework
        run: |
          cd Mindustry
          
          # Force Gradle/RoboVM to extract JARs and generate cache folders
          ./gradlew :ios:robovmArchive --no-daemon --dry-run || true
          cd ..

          # Copy MetalANGLEKit.framework into all discovered RoboVM cache directories
          echo "Injecting MetalANGLEKit.framework into RoboVM search directories..."
          find ~/.robovm/cache -type d -name "libs" 2>/dev/null | while read -r libdir; do
            echo "Copying to: $libdir"
            cp -R Mindustry/ios/libs/MetalANGLEKit.framework "$libdir/"
          done

          # Dynamically append absolute framework paths into Mindustry/ios/robovm.xml
          ABS_LIBS="$(pwd)/Mindustry/ios/libs"
          if [ -f "Mindustry/ios/robovm.xml" ]; then
            sed -i '' "s|<\/frameworkPaths>|<path>$ABS_LIBS<\/path><\/frameworkPaths>|" Mindustry/ios/robovm.xml
          fi

      - name: Patch Obsolete GL Framework References
        run: |
          # Remove old GLES/EGL references from cached robovm.xml files if extracted from old Arc JARs
          find ~/.gradle/caches ~/.robovm/cache -name "robovm.xml" 2>/dev/null | while read -r xmlfile; do
            if grep -q "libGLESv2" "$xmlfile"; then
              sed -i '' '/<framework>libGLESv2<\/framework>/d' "$xmlfile"
              sed -i '' '/<framework>libEGL<\/framework>/d' "$xmlfile"
              sed -i '' '/<framework>libfeature_support<\/framework>/d' "$xmlfile"
            fi
          done

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
