name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Download Native Libraries and MetalANGLEKit
        run: |
          # 1. Setup target directory inside Mindustry
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Fetch prebuilt static C++ library (libarc-freetype.a) from Arc
          echo "Downloading libarc-freetype.a..."
          curl -L -f -o Mindustry/ios/libs/libarc-freetype.a "https://raw.githubusercontent.com/Anuken/Arc/master/natives/ios/libs/libarc-freetype.a" || \
          curl -L -f -o Mindustry/ios/libs/libarc-freetype.a "https://raw.githubusercontent.com/Anuken/Arc/master/backends/backend-robovm/libs/ios/libarc-freetype.a" || \
          touch Mindustry/ios/libs/libarc-freetype.a

          # 3. Download RoboVM CocoaTouch artifact from Maven Central
          echo "Downloading RoboVM CocoaTouch JAR (14.5MB)..."
          curl -L -f -o /tmp/robovm-cocoatouch.jar "https://repo1.maven.org/maven2/com/mobidevelop/robovm/robovm-cocoatouch/2.3.20/robovm-cocoatouch-2.3.20.jar"

          # 4. Extract entire JAR to a temporary folder
          mkdir -p /tmp/cocoatouch_out
          unzip -q /tmp/robovm-cocoatouch.jar -d /tmp/cocoatouch_out/

          # 5. Search for MetalANGLEKit.framework and copy it into Frameworks/
          find /tmp/cocoatouch_out -type d -name "MetalANGLEKit.framework" -exec cp -R {} Mindustry/ios/libs/Frameworks/ \;

          # 6. Mirror extracted frameworks to the RoboVM cache directory for clang++
          CACHE_DIR="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$CACHE_DIR"
          if [ -d "Mindustry/ios/libs/Frameworks/MetalANGLEKit.framework" ]; then
            cp -R Mindustry/ios/libs/Frameworks/MetalANGLEKit.framework "$CACHE_DIR/"
          fi

          # 7. Print verification details
          echo "=== Frameworks Directory Contents ==="
          ls -la Mindustry/ios/libs/Frameworks/

          if [ ! -d "Mindustry/ios/libs/Frameworks/MetalANGLEKit.framework" ]; then
            echo "ERROR: MetalANGLEKit.framework was not found in JAR contents!"
            exit 1
          fi

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
