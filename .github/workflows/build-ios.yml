name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew

      - name: Print Available iOS Tasks
        run: |
          cd Mindustry
          ./gradlew :ios:tasks

      - name: Attempt Build with Stacktrace
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true --stacktrace
