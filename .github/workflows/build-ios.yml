name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Resolve Dependencies & Extract MetalANGLEKit
        run: |
          # 1. Target directory expected by clang++
          TARGET_CACHE="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$TARGET_CACHE"
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Copy static libraries (.a) from Arc
          echo "Copying static libraries..."
          find Arc -name "*.a" -exec cp {} Mindustry/ios/libs/ \; || true

          # 3. Force Gradle to download and resolve all iOS native dependencies
          echo "Resolving iOS project dependencies in Mindustry..."
          cd Mindustry
          ./gradlew :ios:dependencies || true
          cd ..

          # 4. Search all caches (~/.gradle, ~/.m2, ~/.robovm) for existing framework directories
          echo "Scanning filesystem for uncompressed frameworks..."
          find ~/.gradle ~/.m2 ~/.robovm -type d \( -name "*.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
            echo "Found framework directory: $FW"
            cp -R "$FW" "$TARGET_CACHE/" || true
            cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
          done

          # 5. Unpack all RoboVM & Arc JARs found in Gradle/Maven caches
          echo "Scanning JAR files in caches for embedded frameworks..."
          find ~/.gradle ~/.m2 ~/.robovm Arc Mindustry -name "*.jar" 2>/dev/null | while read JAR; do
            # Check if JAR contains frameworks or robovm files
            if unzip -l "$JAR" 2>/dev/null | grep -iE "framework|robovm|MetalANGLE"; then
              echo "Extracting matching JAR: $JAR"
              TMP_DIR=$(mktemp -d)
              unzip -o -q "$JAR" -d "$TMP_DIR"
              
              # Copy any found framework bundles
              find "$TMP_DIR" -type d \( -name "*.framework" -o -name "*.xcframework" \) 2>/dev/null | while read FW; do
                echo "--> Extracted framework: $(basename "$FW")"
                cp -R "$FW" "$TARGET_CACHE/" || true
                cp -R "$FW" Mindustry/ios/libs/Frameworks/ || true
              done
              
              # Copy any files inside META-INF/robovm/ directly to cache
              if [ -d "$TMP_DIR/META-INF/robovm" ]; then
                cp -R "$TMP_DIR/META-INF/robovm/"* "$TARGET_CACHE/" 2>/dev/null || true
              fi
              
              rm -rf "$TMP_DIR"
            fi
          done

          # -------------------------------------------------------------
          # 6. FAIL-FAST CHECKER: Verify frameworks exist before building
          # -------------------------------------------------------------
          echo "=== Target Cache Contents ==="
          ls -la "$TARGET_CACHE" || true

          if [ -z "$(ls -A "$TARGET_CACHE")" ]; then
            echo "---------------------------------------------------------"
            echo "CRITICAL ERROR: No RoboVM frameworks were found!"
            echo "Stopping build to prevent waiting for clang failure."
            echo "---------------------------------------------------------"
            exit 1
          fi

          echo "SUCCESS: Native frameworks found! Proceeding to build."

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
