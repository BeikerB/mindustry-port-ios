name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Manual MetalANGLE Framework
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p temp_extracted
          
          ZIP_FILE=$(find . -maxdepth 2 -iname "*MetalANGLE*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file at: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip was not found!"
            exit 1
          fi

          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Copying MetalANGLEKit.framework to Mindustry/ios/libs..."
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
          else
            echo "ERROR: MetalANGLEKit.framework missing inside zip!"
            exit 1
          fi
          
          rm -rf temp_extracted
          
      - name: Fetch and Extract Arc Native Libraries
        run: |
          mkdir -p Mindustry/ios/libs

          # Download Arc native libraries archive
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          
          if [ -f "arccoreios.zip" ]; then
            echo "Extracting Arc native libraries..."
            unzip -o -q arccoreios.zip -d temp_natives
            # Copy all .a static libraries into Mindustry/ios/libs
            find temp_natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \;
            rm -rf temp_natives arccoreios.zip
          fi

          # Verify that libarc-freetype.a exists
          if [ ! -f "Mindustry/ios/libs/libarc-freetype.a" ]; then
            echo "ERROR: libarc-freetype.a is missing from Mindustry/ios/libs/"
            echo "Contents of Mindustry/ios/libs/:"
            ls -la Mindustry/ios/libs/
            exit 1
          else
            echo "Successfully populated Mindustry/ios/libs with native libraries."
          fi

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Patch Arc JAR to Remove Invalid Framework Entries
        run: |
          find ~/.gradle/caches/modules-2/files-2.1/com.github.Anuken.Arc/backend-robovm -name "*.jar" | while read -r jarfile; do
            echo "Patching $jarfile..."
            mkdir -p temp_jar
            unzip -q "$jarfile" -d temp_jar
            
            if [ -f "temp_jar/META-INF/robovm/ios/robovm.xml" ]; then
              sed -i '' '/<framework>libGLESv2<\/framework>/d' temp_jar/META-INF/robovm/ios/robovm.xml
              sed -i '' '/<framework>libEGL<\/framework>/d' temp_jar/META-INF/robovm/ios/robovm.xml
              sed -i '' '/<framework>libfeature_support<\/framework>/d' temp_jar/META-INF/robovm/ios/robovm.xml
              
              (cd temp_jar && zip -q -r "$jarfile" .)
            fi
            rm -rf temp_jar
          done

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
