name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Download Native Libraries and MetalANGLEKit
        run: |
          # 1. Setup target directory inside Mindustry
          mkdir -p Mindustry/ios/libs/Frameworks

          # 2. Fetch prebuilt static C++ library (libarc-freetype.a)
          curl -L -o Mindustry/ios/libs/libarc-freetype.a "https://raw.githubusercontent.com/Anuken/Mindustry/master/ios/libs/libarc-freetype.a"

          # 3. Download RoboVM CocoaTouch artifact from Maven Central
          echo "Downloading RoboVM CocoaTouch artifact..."
          curl -L -o /tmp/robovm-cocoatouch.jar "https://repo1.maven.org/maven2/com/mobidevelop/robovm/robovm-cocoatouch/2.3.20/robovm-cocoatouch-2.3.20.jar"

          # 4. Extract MetalANGLEKit.framework from the JAR
          mkdir -p /tmp/cocoatouch_out
          unzip -q /tmp/robovm-cocoatouch.jar -d /tmp/cocoatouch_out/

          # Copy MetalANGLEKit.framework to Mindustry libs
          find /tmp/cocoatouch_out -name "MetalANGLEKit.framework" -type d -exec cp -R {} Mindustry/ios/libs/Frameworks/ \;

          # 5. Mirror to expected RoboVM cache path for clang++
          CACHE_DIR="$HOME/.robovm/cache/ios/arm64/release/Users/runner/work/mindustry-port-ios/mindustry-port-ios/Arc/backends/backend-robovm/build/libs/backend-robovm-1.0.jar.extracted/META-INF/robovm/ios/libs"
          mkdir -p "$CACHE_DIR"
          cp -R Mindustry/ios/libs/Frameworks/* "$CACHE_DIR/" || true

          # 6. Verify extraction
          echo "Frameworks setup summary:"
          ls -la Mindustry/ios/libs/
          ls -la Mindustry/ios/libs/Frameworks/

          if [ ! -d "Mindustry/ios/libs/Frameworks/MetalANGLEKit.framework" ]; then
            echo "ERROR: MetalANGLEKit.framework failed to extract!"
            exit 1
          fi

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
