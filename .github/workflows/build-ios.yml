name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry

      - name: Checkout Arc Framework
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Permissions
        run: |
          chmod +x Mindustry/gradlew
          chmod +x Arc/gradlew || true

      - name: Extract Embedded Frameworks to Local Directory
        run: |
          # 1. Fetch static libarc-freetype.a
          mkdir -p Mindustry/ios/libs/Frameworks
          curl -L -o Mindustry/ios/libs/libarc-freetype.a "https://raw.githubusercontent.com/Anuken/Mindustry/master/ios/libs/libarc-freetype.a"

          # 2. Build backend-robovm JAR inside Arc
          cd Arc
          ./gradlew :backends:backend-robovm:jar
          cd ..

          # 3. Extract the JAR into a temporary location
          JAR_FILE=$(find Arc/backends/backend-robovm/build/libs -name "*.jar" | head -n 1)
          if [ -n "$JAR_FILE" ]; then
            echo "Found JAR: $JAR_FILE"
            mkdir -p /tmp/jar_out
            unzip -o "$JAR_FILE" -d /tmp/jar_out
            
            # Find any .framework directories inside the JAR and copy them to Mindustry/ios/libs/Frameworks/
            find /tmp/jar_out -name "*.framework" -type d -exec cp -R {} Mindustry/ios/libs/Frameworks/ \;
            
            echo "JAR extraction completed"
          else
            echo "ERROR: backend-robovm JAR not found!"
            exit 1
          fi

          # 4. Verify MetalANGLEKit.framework was extracted
          echo "Extracted Frameworks:"
          ls -laR Mindustry/ios/libs/Frameworks/
          
          # Check if MetalANGLEKit exists
          if [ ! -d "Mindustry/ios/libs/Frameworks/MetalANGLEKit.framework" ]; then
            echo "WARNING: MetalANGLEKit.framework not found in JAR extraction"
            echo "Checking JAR contents for frameworks:"
            unzip -l "$JAR_FILE" | grep -i "\.framework" || echo "No .framework files found in JAR"
          fi

      - name: Build Unsigned iOS App
        run: |
          cd Mindustry
          # Pass the local Frameworks directory directly to RoboVM via -Probovm.frameworkPaths
          ./gradlew pack
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            -Probovm.device.name="iPhone" \
            -Probovm.frameworkPaths="$(pwd)/ios/libs/Frameworks"

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find Mindustry/ios/build/robovm -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Mindustry-v8-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry-v8-unsigned.ipa
