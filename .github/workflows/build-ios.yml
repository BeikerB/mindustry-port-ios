name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry
          lfs: true
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Manual MetalANGLE Framework
        run: |
          mkdir -p Mindustry/ios/libs
          mkdir -p temp_extracted
          
          ZIP_FILE=$(find . -maxdepth 2 -iname "*MetalANGLE*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Found MetalANGLE zip file at: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d temp_extracted
          else
            echo "ERROR: MetalANGLEKit.zip was not found in the root directory!"
            exit 1
          fi

          FOUND_FRAMEWORK=$(find temp_extracted -name "MetalANGLEKit.framework" | head -n 1)
          
          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Copying MetalANGLEKit.framework to Mindustry/ios/libs..."
            cp -R "$FOUND_FRAMEWORK" Mindustry/ios/libs/
          else
            echo "ERROR: MetalANGLEKit.framework missing inside zip!"
            exit 1
          fi
          
          rm -rf temp_extracted

      - name: Fetch Arc Native Libraries (.a files)
        run: |
          mkdir -p Mindustry/ios/libs

          # Download Arc native libraries release archive
          curl -L -s -o arccoreios.zip "https://github.com/sonphantrung/Arc/releases/download/ios-natives/arccoreios.zip" || true
          
          if [ -f "arccoreios.zip" ]; then
            echo "Extracting Arc native libraries..."
            unzip -o -q arccoreios.zip -d temp_natives
            find temp_natives -name "*.a" -exec cp {} Mindustry/ios/libs/ \;
            rm -rf temp_natives arccoreios.zip
          fi

          if [ ! -f "Mindustry/ios/libs/libarc-freetype.a" ]; then
            echo "WARNING: libarc-freetype.a not found via release zip, verifying directory..."
          fi

      - name: Resolve Dependencies and Patch Extracted Configs
        run: |
          cd Mindustry
          # 1. Run a dry-run compile to force RoboVM to extract dependency configs
          ./gradlew :ios:robovmArchive --no-daemon --dry-run || true
          cd ..

          # 2. Patch every robovm.xml found across Gradle caches, RoboVM cache, and build directories
          echo "Locating and patching all robovm.xml files..."
          
          find ~/.gradle/caches ~/.robovm/cache Mindustry/ios/build Mindustry/build -name "robovm.xml" 2>/dev/null | while read -r xmlfile; do
            if grep -q "libGLESv2" "$xmlfile"; then
              echo "Patching: $xmlfile"
              sed -i '' '/<framework>libGLESv2<\/framework>/d' "$xmlfile"
              sed -i '' '/<framework>libEGL<\/framework>/d' "$xmlfile"
              sed -i '' '/<framework>libfeature_support<\/framework>/d' "$xmlfile"
            fi
          done

          # 3. Also patch inside any JARs just in case
          find ~/.gradle/caches/modules-2/files-2.1/com.github.Anuken.Arc/backend-robovm -name "*.jar" | while read -r jarfile; do
            TMP_DIR=$(mktemp -d)
            unzip -q "$jarfile" -d "$TMP_DIR"
            XML_PATH="$TMP_DIR/META-INF/robovm/ios/robovm.xml"
            if [ -f "$XML_PATH" ] && grep -q "libGLESv2" "$XML_PATH"; then
              echo "Patching JAR: $jarfile"
              sed -i '' '/<framework>libGLESv2<\/framework>/d' "$XML_PATH"
              sed -i '' '/<framework>libEGL<\/framework>/d' "$XML_PATH"
              sed -i '' '/<framework>libfeature_support<\/framework>/d' "$XML_PATH"
              (cd "$TMP_DIR" && zip -q -f "$jarfile" META-INF/robovm/ios/robovm.xml)
            fi
            rm -rf "$TMP_DIR"
          done

      - name: Grant Permissions
        run: chmod +x Mindustry/gradlew

      - name: Run robovmArchive
        run: |
          cd Mindustry
          ./gradlew robovmArchive \
            --no-daemon \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: |
            Mindustry/ios/build/robovm/*.ipa
            Mindustry/ios/build/robovm.tmp/*.ipa
          retention-days: 7
